<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 130" fill="none" class="w-full h-auto">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38A3A5" />
      <stop offset="50%" stop-color="#2EC4B6" />
      <stop offset="100%" stop-color="#19485F" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Logo Emblem: Connected nodes orbit & human smile / data connectivity -->
  <g transform="translate(10, 10)">
    <!-- Outer orbiting arc ring -->
    <path d="M 52 14 A 42 42 0 1 0 94 65" fill="none" stroke="url(#orbitGrad)" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Top node -->
    <circle cx="52" cy="14" r="7.5" fill="#38A3A5" stroke="#FFFFFF" stroke-width="2" />
    
    <!-- Left-lower node -->
    <circle cx="15" cy="74" r="7.5" fill="#52B788" stroke="#FFFFFF" stroke-width="2" />
    
    <!-- Right-lower node -->
    <circle cx="94" cy="65" r="8" fill="#13384A" stroke="#FFFFFF" stroke-width="2" />

    <!-- Center 'O' circle and smile -->
    <circle cx="55" cy="52" r="21" fill="none" stroke="#0F3244" stroke-width="5" />
    <!-- Friendly human / community arc inside -->
    <path d="M 41 55 Q 55 70 69 55" fill="none" stroke="#0F3244" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Data pulse spark node -->
    <circle cx="78" cy="30" r="3.5" fill="#38A3A5" />
  </g>

  <!-- Typography: Oudiamora.net -->
  <g transform="translate(125, 68)">
    <text font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.03em" fill="#0E3346">
      Oudiamora<tspan fill="#38A3A5">.</tspan>net
    </text>
  </g>

  <!-- Tagline: Open Data + IA -->
  <g transform="translate(128, 100)">
    <text font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="500" letter-spacing="0.04em" fill="#5A6E7C">
      Open Data + IA
    </text>
  </g>
</svg>
